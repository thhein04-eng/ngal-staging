<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northlight Home Staging — Portland, Oregon</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Northlight is a full-service home staging studio in Portland, Oregon. Occupied staging, vacant staging, and consultations that get listings sold faster."
    />
    <meta name="theme-color" content="#2f5d50" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Northlight Home Staging" />
    <meta
      property="og:title"
      content="Northlight Home Staging — Portland, Oregon"
    />
    <meta
      property="og:description"
      content="Homes that photograph beautifully and sell faster. Staging for Portland-area listings since 2014."
    />
    <meta property="og:image" content="/images/hero-living-room.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Runs before first paint so the page never flashes the wrong theme, and so
      reveal animations start hidden rather than snapping. If this script does
      not run — JavaScript disabled, CSP block — `motion-ready` is absent and
      every element renders in its final, visible state.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem('nl-theme');
          if (saved === 'light' || saved === 'dark') {
            root.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* Storage unavailable (private mode); fall back to the OS setting. */
        }
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('motion-ready');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
